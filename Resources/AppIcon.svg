<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5B5CF0"/>
      <stop offset="1" stop-color="#23206E"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F5FF"/>
      <stop offset="1" stop-color="#C9CCF5"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#F0364A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B0A3A" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Squircle body (Apple icon grid: 824px shape centered on a 1024 canvas) -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>

    <!-- Other items, fanned in the tray -->
    <g transform="rotate(-11 512 640)">
      <rect x="300" y="380" width="360" height="220" rx="30" fill="#7F84EE"/>
    </g>
    <g transform="rotate(9 512 640)">
      <rect x="364" y="380" width="360" height="220" rx="30" fill="#A3A8F8"/>
    </g>

    <!-- The one that needs you: lifted out of the stack -->
    <g filter="url(#shadow)" transform="rotate(-4 512 360)">
      <clipPath id="card"><rect x="302" y="232" width="420" height="244" rx="36"/></clipPath>
      <rect x="302" y="232" width="420" height="244" rx="36" fill="#FFFFFF"/>
      <rect x="302" y="232" width="26" height="244" fill="url(#hot)" clip-path="url(#card)"/>
      <circle cx="394" cy="312" r="30" fill="url(#hot)"/>
      <rect x="446" y="292" width="226" height="26" rx="13" fill="#2B2A6B" opacity="0.85"/>
      <rect x="446" y="334" width="160" height="22" rx="11" fill="#2B2A6B" opacity="0.35"/>
      <rect x="364" y="396" width="308" height="22" rx="11" fill="#2B2A6B" opacity="0.16"/>
    </g>

    <!-- Tray front with the inbox notch -->
    <g filter="url(#shadow)">
      <path d="M 252 560
               L 404 560 Q 418 560 424 573 L 446 622 Q 452 636 467 636
               L 557 636 Q 572 636 578 622 L 600 573 Q 606 560 620 560
               L 772 560 L 772 718 Q 772 780 710 780
               L 314 780 Q 252 780 252 718 Z"
            fill="url(#tray)"/>
    </g>
  </g>
</svg>
